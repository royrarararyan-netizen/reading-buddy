<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#5346a8">
<title>북스캔 · 책을 만나는 가장 쉬운 방법</title>
<style>
:root{--ink:#28223e;--violet:#5d4cb5;--lav:#edeaff;--paper:#fffdf8;--muted:#756f88;--line:#e9e5f4;--gold:#efad42}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;background:radial-gradient(circle at top left,#eae3ff,transparent 37%),#f9f7fc;min-height:100vh}main{max-width:760px;margin:auto;padding:25px 17px 65px}.brand{font-weight:900;font-size:24px;letter-spacing:-1.2px;color:var(--violet)}.brand span{color:#f3a43e}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.saved{background:#fff;border:1px solid var(--line);border-radius:99px;padding:9px 12px;color:var(--violet);font-weight:700;font-size:12px}.hero{padding:28px;border-radius:26px;background:linear-gradient(135deg,#463892,#7968dc);color:#fff;box-shadow:0 18px 42px #45308e38;position:relative;overflow:hidden}.hero:after{content:"📚";position:absolute;font-size:110px;right:17px;bottom:-18px;transform:rotate(-10deg);opacity:.25}.hero h1{margin:5px 0 9px;font-size:clamp(28px,7vw,43px);letter-spacing:-2px;line-height:1.18}.hero p{margin:0;color:#e4dfff;line-height:1.55;font-size:14px;max-width:390px}.card{background:var(--paper);border:1px solid #ebe7f2;border-radius:22px;padding:20px;margin-top:15px;box-shadow:0 8px 23px #34295d10}.card h2{font-size:18px;margin:0 0 5px;letter-spacing:-.8px}.note{font-size:12px;color:var(--muted);line-height:1.55;margin:0 0 14px}.upload{border:2px dashed #cfc6f5;border-radius:17px;background:#faf9ff;min-height:178px;display:grid;place-items:center;text-align:center;padding:20px;cursor:pointer;overflow:hidden;position:relative}.upload:hover{border-color:var(--violet);background:#f4f1ff}.upload img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}.upload .upload-text{color:var(--violet);font-weight:800;line-height:1.7}.upload small{display:block;color:var(--muted);font-weight:500}.row{display:flex;gap:10px;margin-top:12px}.title-input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--ink);font:inherit;background:#fff}.action{border:0;border-radius:12px;padding:12px 15px;background:var(--violet);color:#fff;font:inherit;font-weight:800;cursor:pointer}.action:disabled{opacity:.55;cursor:not-allowed}.status{min-height:22px;margin:12px 2px 0;color:var(--muted);font-size:12px}.result{display:none}.book{display:grid;grid-template-columns:110px 1fr;gap:17px}.cover{width:110px;aspect-ratio:2/3;border-radius:11px;object-fit:cover;background:var(--lav);box-shadow:0 7px 16px #44387925}.book h2{font-size:21px;line-height:1.25;margin:0 0 7px}.author{font-size:13px;color:var(--muted);margin:0 0 11px}.pills{display:flex;flex-wrap:wrap;gap:6px}.pill{padding:6px 8px;border-radius:99px;background:var(--lav);color:#4e3e9e;font-weight:700;font-size:11px}.stars{color:#d88c14;font-weight:800;font-size:13px;margin-top:10px}.summary{font-size:13px;line-height:1.68;color:#504b60;white-space:pre-line;margin:17px 0 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:14px}.tip{padding:15px;border-radius:16px;background:#f9f7ff}.tip h3{margin:0 0 6px;font-size:14px}.tip p{margin:0;color:var(--muted);font-size:12px;line-height:1.6}.wide{grid-column:1/-1}.save-book{width:100%;margin-top:15px}.empty{display:none;text-align:center;padding:15px;color:var(--muted);font-size:13px}.shelf{display:flex;gap:10px;overflow:auto;padding-top:5px}.shelf-item{flex:0 0 80px}.shelf-item img{width:80px;height:112px;object-fit:cover;border-radius:7px;background:var(--lav)}.shelf-item p{font-size:10px;line-height:1.35;margin:5px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}@media(max-width:450px){main{padding:18px 13px 50px}.hero{padding:23px}.book{grid-template-columns:86px 1fr;gap:13px}.cover{width:86px}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.row{flex-direction:column}.action{width:100%}}
</style>
</head>
<body><main>
<header><div class="brand">북<span>스캔</span></div><button class="saved" id="goShelf">📖 내 책장</button></header>
<section class="hero"><small>사진 한 장으로 시작하는 독서</small><h1>이 책, 나에게<br>재미있을까?</h1><p>표지 사진을 찍거나 올리면 제목을 찾아 책의 줄거리와 읽기 포인트를 알려드려요.</p></section>
<section class="card"><h2>책 표지 스캔</h2><p class="note">밝은 곳에서 표지의 제목이 잘 보이게 찍어 주세요. 사진은 기기 안에서 제목 인식에만 사용됩니다.</p>
<label class="upload" for="photo"><div class="upload-text">📷 책 표지 사진 찍기 또는 올리기<small>휴대폰에서는 카메라가 열립니다</small></div><img id="preview" hidden alt="선택한 책 표지"></label>
<input id="photo" type="file" accept="image/*" capture="environment" hidden>
<div class="row"><input id="query" class="title-input" placeholder="제목을 직접 입력해도 돼요"><button class="action" id="find">책 정보 찾기</button></div><p class="status" id="status">사진을 올리면 제목을 읽어 볼게요.</p></section>
<section class="card result" id="result"><div class="book"><img class="cover" id="cover" alt="책 표지"><div><h2 id="bookTitle"></h2><p class="author" id="author"></p><div class="pills" id="pills"></div><div class="stars" id="rating"></div></div></div>
<p class="summary" id="summary"></p><div class="grid"><article class="tip"><h3>🎓 추천 독서 단계</h3><p id="grade"></p></article><article class="tip"><h3>✨ 이 책의 매력</h3><p id="hook"></p></article><article class="tip wide"><h3>💬 읽기 전 질문</h3><p id="question"></p></article></div><button class="action save-book" id="saveBook">내 책장에 담기</button></section>
<section class="card"><h2>내 책장</h2><p class="note">나중에 읽고 싶은 책을 저장해 두세요.</p><div class="shelf" id="shelf"></div><p class="empty" id="empty">아직 저장한 책이 없어요. 마음에 드는 책을 찾아 담아 보세요!</p></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const $=s=>document.querySelector(s); let selected=null; const key='bookscan-shelf';
function clean(t){return (t||'').replace(/<[^>]+>/g,'').replace(/&quot;/g,'"').replace(/&#39;/g,"'").trim()}
function grade(info){const p=info.pageCount||180,cat=(info.categories||[]).join(' ').toLowerCase(),title=(info.title||'').toLowerCase();if(/picture|children|아동|동화/.test(cat+title))return '초등 저학년부터 · 보호자와 함께 읽어도 좋아요.';if(p>420)return '중학생 이상 · 긴 호흡으로 읽는 책이에요.';if(/history|science|사회|과학|철학/.test(cat))return '초등 고학년 이상 · 낯선 단어는 함께 찾아보세요.';return '초등 고학년부터 · 관심 있다면 누구나 즐길 수 있어요.'}
function hook(info){const c=(info.categories||[])[0]||'이야기';const desc=clean(info.description);if(/mystery|추리|미스터리/i.test(c+desc))return '단서를 따라가며 결말을 추리하는 재미가 있어요.';if(/fantasy|판타지/i.test(c+desc))return '현실을 잠시 잊게 하는 새로운 세계가 기다려요.';return c+'을(를) 통해 새로운 생각과 이야기를 만날 수 있어요.'}
function show(info){selected=info;const img=info.imageLinks?.thumbnail||info.imageLinks?.smallThumbnail||'';$('#cover').src=img;$('#cover').style.visibility=img?'visible':'hidden';$('#bookTitle').textContent=info.title||'제목을 찾지 못했어요';$('#author').textContent=(info.authors||['저자 정보 없음']).join(', ')+' · '+(info.publishedDate||'출간일 미상');$('#pills').innerHTML=[...(info.categories||[]).slice(0,2),info.pageCount?info.pageCount+'쪽':''].filter(Boolean).map(x=>'<span class="pill">'+x+'</span>').join('');$('#rating').textContent=info.averageRating?'★ '+info.averageRating+' / 5  ('+(info.ratingsCount||0)+'명 평가)':'평점 정보가 아직 없어요';$('#summary').textContent=clean(info.description)||'이 책의 자세한 줄거리는 제공되지 않았어요. 제목과 저자, 표지를 보고 어떤 이야기가 펼쳐질지 상상해 보세요!';$('#grade').textContent=grade(info);$('#hook').textContent=hook(info);$('#question').textContent='표지와 제목을 보고 가장 궁금해진 점은 무엇인가요? 읽으면서 답을 찾아 보세요.';$('#result').style.display='block';$('#result').scrollIntoView({behavior:'smooth',block:'start'})}
async function lookup(q){q=q.trim();if(!q){$('#status').textContent='제목을 입력하거나 사진을 먼저 올려 주세요.';return}$('#find').disabled=true;$('#status').textContent='책 정보를 찾는 중…';try{const res=await fetch('https://www.googleapis.com/books/v1/volumes?maxResults=12&q='+encodeURIComponent('intitle:'+q));const data=await res.json();const item=(data.items||[]).find(x=>x.volumeInfo?.title?.toLowerCase().includes(q.toLowerCase()))||data.items?.[0];if(!item)throw Error();show(item.volumeInfo);$('#status').textContent='책 정보를 찾았어요!';}catch(e){$('#status').textContent='찾지 못했어요. 제목을 더 정확히 입력해 다시 시도해 보세요.'}finally{$('#find').disabled=false}}
$('#photo').onchange=async e=>{const file=e.target.files[0];if(!file)return;const url=URL.createObjectURL(file);$('#preview').src=url;$('#preview').hidden=false;$('#status').textContent='사진에서 제목을 읽는 중…';try{if(!window.Tesseract)throw Error();const r=await Tesseract.recognize(file,'kor+eng',{logger:m=>{if(m.status==='recognizing text')$('#status').textContent='표지 글자 인식 중… '+Math.round(m.progress*100)+'%'}});const text=r.data.text.replace(/\n+/g,' ').replace(/[^\p{L}\p{N}\s'’-]/gu,' ').replace(/\s+/g,' ').trim();$('#query').value=text.slice(0,100);$('#status').textContent=text?'읽어 낸 글자를 확인하고 “책 정보 찾기”를 눌러 주세요.':'글자를 읽지 못했어요. 제목을 직접 입력해 주세요.'}catch(err){$('#status').textContent='사진 미리보기 완료. 제목을 직접 입력해 찾을 수 있어요.'}}
$('#find').onclick=()=>lookup($('#query').value);$('#query').onkeydown=e=>{if(e.key==='Enter')lookup(e.target.value)};
function renderShelf(){const list=JSON.parse(localStorage.getItem(key)||'[]');$('#shelf').innerHTML=list.map((x,i)=>'<article class="shelf-item" title="'+x.title+'"><img src="'+(x.img||'')+'" alt=""><p>'+x.title+'</p></article>').join('');$('#empty').style.display=list.length?'none':'block'}
$('#saveBook').onclick=()=>{if(!selected)return;const list=JSON.parse(localStorage.getItem(key)||'[]');if(!list.some(x=>x.title===selected.title))list.unshift({title:selected.title,img:selected.imageLinks?.thumbnail||''});localStorage.setItem(key,JSON.stringify(list.slice(0,20)));renderShelf();$('#saveBook').textContent='책장에 담았어요 ✓';setTimeout(()=>$('#saveBook').textContent='내 책장에 담기',1600)};$('#goShelf').onclick=()=>document.querySelector('.shelf').scrollIntoView({behavior:'smooth',block:'center'});renderShelf();
</script></body></html>
