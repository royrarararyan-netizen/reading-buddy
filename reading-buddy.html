<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>책콩 독서도우미</title>
  <style>
    :root{--ink:#25233a;--muted:#727087;--paper:#fffdf8;--cream:#fff4dc;--mint:#ccefdc;--mint-deep:#3c9b75;--purple:#7562c7;--line:#ece6dc;--gold:#f7ba2e;--pink:#ffdedb}*{box-sizing:border-box}body{margin:0;background:#f6f2eb;color:var(--ink);font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif}.app{max-width:1180px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.brand{display:flex;align-items:center;gap:11px;font-size:22px;font-weight:800}.mark{width:39px;height:39px;border-radius:14px;background:var(--purple);color:white;display:grid;place-items:center;font-size:20px;box-shadow:0 6px 16px #7562c744}.coin{background:#fff;border:1px solid var(--line);padding:10px 15px;border-radius:99px;font-weight:800;display:flex;gap:7px;align-items:center}.coin b{color:#b56d00}.hero{background:linear-gradient(120deg,#fff1cb,#dff7ed);border-radius:30px;padding:32px;display:grid;grid-template-columns:1.3fr .7fr;gap:26px;overflow:hidden;position:relative}.eyebrow{color:var(--mint-deep);font-weight:800;font-size:14px}.hero h1{font-size:clamp(28px,5vw,46px);line-height:1.18;margin:8px 0 13px}.hero p{color:#5f5d6e;margin:0 0 22px;line-height:1.7}.hero-art{font-size:105px;align-self:center;text-align:center;filter:drop-shadow(0 12px 7px #987d4644)}.controls{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.field{display:grid;gap:6px;font-weight:700;font-size:14px}.field select{border:1px solid #d6d0c7;border-radius:12px;background:#fff;padding:11px 13px;font:inherit;color:var(--ink)}button{border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:800;cursor:pointer}.primary{background:var(--purple);color:#fff}.secondary{background:#fff;border:1px solid var(--line);color:var(--ink)}.weekly{display:flex;gap:9px;align-items:center;color:var(--muted);font-size:14px;margin:18px 2px}.dot{width:8px;height:8px;border-radius:50%;background:var(--mint-deep)}.section-title{display:flex;justify-content:space-between;align-items:end;margin:32px 0 16px}.section-title h2{margin:0;font-size:24px}.section-title span{font-size:14px;color:var(--muted)}.books{display:grid;grid-template-columns:repeat(5,1fr);gap:15px}.book{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:9px;box-shadow:0 4px 12px #3e2d1407}.cover{width:100%;aspect-ratio: .7;object-fit:cover;border-radius:12px;display:block;background:#ddd}.book h3{font-size:15px;line-height:1.35;margin:10px 2px 4px}.book p{font-size:12px;color:var(--muted);margin:0 2px 10px}.book button{width:100%;padding:9px;font-size:13px;background:#f0ecff;color:#55419f}.progress{margin-top:12px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;align-items:center;gap:15px}.bar{flex:1;height:10px;border-radius:99px;background:#eee9e0;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#70c995,#72a6db);border-radius:inherit;transition:.3s}.progress strong{min-width:55px;text-align:right}.shop{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.item{background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px}.item .icon{font-size:36px}.item h3{font-size:16px;margin:9px 0 4px}.item p{font-size:13px;color:var(--muted);height:32px;margin:0 0 10px}.item footer{display:flex;justify-content:space-between;align-items:center}.price{font-size:14px;font-weight:800;color:#a86b00}.item button{padding:8px 10px;font-size:13px;background:var(--cream)}.item.owned{background:#f4fff9;border-color:#b9e6ce}.item.owned button{background:var(--mint);color:#257253}.dialog{position:fixed;inset:0;background:#31284566;display:none;place-items:center;padding:18px;z-index:5}.dialog.show{display:grid}.modal{max-width:510px;width:100%;background:#fff;border-radius:24px;padding:27px;box-shadow:0 16px 50px #281d4544}.modal h2{margin:0 0 8px}.modal p{color:var(--muted);font-size:14px;line-height:1.6}.modal textarea{width:100%;height:130px;resize:none;margin:10px 0 13px;border:1px solid var(--line);border-radius:13px;padding:13px;font:inherit;line-height:1.8}.actions{display:flex;gap:9px;justify-content:flex-end}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);opacity:0;background:#25233a;color:white;padding:12px 17px;border-radius:99px;font-weight:700;transition:.25s;z-index:8}.toast.show{transform:translate(-50%,0);opacity:1}@media(max-width:850px){.books{grid-template-columns:repeat(3,1fr)}.shop{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.app{padding:15px}.hero{padding:25px;grid-template-columns:1fr}.hero-art{display:none}.books{grid-template-columns:repeat(2,1fr);gap:10px}.top{margin-bottom:16px}.brand{font-size:19px}.shop{grid-template-columns:1fr}.progress{flex-wrap:wrap}.bar{order:3;flex-basis:100%}}
  </style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon.svg">

</head>
<body>
  <main class="app">
    <header class="top"><div class="brand"><span class="mark">📚</span>책콩 독서도우미</div><div class="coin">🪙 <b id="coins">0</b> 코인</div></header>
    <section class="hero"><div><div class="eyebrow">이번 주의 독서 모험</div><h1><span id="gradeText">3학년</span>에게 딱 맞는<br>책 10권을 골라봤어요!</h1><p>책을 읽고 3줄 감상문을 남기면 코인을 받아요.<br>멋진 스킨과 독서 스킬도 모아 보세요.</p><div class="controls"><label class="field">학년 선택<select id="grade"><option>1학년</option><option>2학년</option><option selected>3학년</option><option>4학년</option><option>5학년</option><option>6학년</option></select></label><button class="primary" id="recommend">추천 바꾸기</button></div></div><div class="hero-art" aria-hidden="true">🧒🏻<br>📖✨</div></section>
    <div class="weekly"><i class="dot"></i><span>추천 목록은 매주 월요일에 새로워져요 · 다음 리셋까지 <b id="countdown">--일</b></span></div>
    <div class="section-title"><h2>이번 주 추천 책</h2><span>읽은 책을 눌러 감상문을 남겨요</span></div>
    <section class="books" id="books"></section>
    <section class="progress"><span>🌱</span><div><b>이번 주 독서 성장</b><br><small id="progressText">감상문 0개를 썼어요</small></div><div class="bar"><div class="fill" id="fill"></div></div><strong id="progressNum">0 / 10</strong></section>
    <div class="section-title"><h2>코인 상점</h2><span>마음에 드는 보상을 골라요</span></div>
    <section class="shop" id="shop"></section>
  </main>
  <div class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="reviewTitle"><div class="modal"><h2 id="reviewTitle">독서 감상문 쓰기</h2><p id="reviewBook">책을 읽고 느낀 점을 세 줄로 적어 보세요. 완성하면 30코인을 받아요!</p><textarea id="review" placeholder="1. 가장 기억에 남는 장면은…&#10;2. 내가 주인공이라면…&#10;3. 이 책을 친구에게 추천하는 이유는…"></textarea><div class="actions"><button class="secondary" id="cancel">나중에 쓸래요</button><button class="primary" id="submit">감상문 제출 (+30)</button></div></div></div>
  <div class="toast" id="toast"></div>
  <script>
    const allBooks=[
      ['별빛 탐험대','우주·모험','photo-1519608487953-e999c86e7455'],['여우의 비밀 편지','동물·우정','photo-1473445361085-b9a07f55608b'],['꼬마 발명가의 로봇','과학·상상','photo-1535378917042-10a22c95931a'],['바다를 건넌 작은 배','여행·용기','photo-1500534314209-a25ddb2bd429'],['나무 위 우리 집','가족·일상','photo-1441974231531-c6227db76b6e'],['은하수 기차','판타지·여행','photo-1462331940025-496dfbfc7564'],['고양이 탐정 도서관','추리·유머','photo-1507842217343-583bb7270b66'],['지구를 지키는 아이들','환경·실천','photo-1497250681960-ef046c08a56e'],['마법의 지도','판타지·모험','photo-1491841550275-ad7854e35ca6'],['달빛 아래서','감성·성장','photo-1519681393784-d120267933ba']
    ];
    const shopItems=[['🧑🏻‍🚀','우주 탐험가 스킨','별빛을 따라 읽는 독서가','60'],['🦊','여우 친구 스킨','재치 있는 책벌레로 변신','90'],['⚡','집중력 부스터','다음 감상문 코인 +10','80'],['🗺️','모험가의 지도','매주 추천 책 1권 교체','120']];
    let coins=Number(localStorage.getItem('bb-coins')||0), done=JSON.parse(localStorage.getItem('bb-done')||'[]'), selected=null, owned=JSON.parse(localStorage.getItem('bb-owned')||'[]');
    const $=s=>document.querySelector(s); function save(){localStorage.setItem('bb-coins',coins);localStorage.setItem('bb-done',JSON.stringify(done));localStorage.setItem('bb-owned',JSON.stringify(owned));}function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),2300)}
    function renderBooks(){const g=$('#grade').value;$('#gradeText').textContent=g;$('#books').innerHTML=allBooks.map((b,i)=>`<article class="book"><img class="cover" src="https://images.unsplash.com/${b[2]}?auto=format&fit=crop&w=500&q=80" alt="${b[0]} 분위기의 책 사진"><h3>${b[0]}</h3><p>${b[1]} · ${g} 추천</p><button data-id="${i}" ${done.includes(i)?'disabled':''}>${done.includes(i)?'✓ 감상문 완료':'읽었어요'}</button></article>`).join('');document.querySelectorAll('.book button').forEach(x=>x.onclick=()=>openReview(+x.dataset.id));update()}
    function update(){ $('#coins').textContent=coins;$('#progressNum').textContent=`${done.length} / 10`;$('#progressText').textContent=`감상문 ${done.length}개를 썼어요`;$('#fill').style.width=`${done.length*10}%`;save();renderShop()}
    function openReview(id){selected=id;$('#reviewBook').textContent=`「${allBooks[id][0]}」을 읽고, 생각을 세 줄로 적어 보세요. 완성하면 30코인을 받아요!`;$('#review').value='';$('#dialog').classList.add('show');$('#review').focus()}
    function renderShop(){$('#shop').innerHTML=shopItems.map((x,i)=>{let have=owned.includes(i);return `<article class="item ${have?'owned':''}"><div class="icon">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p><footer><span class="price">🪙 ${x[3]}</span><button data-buy="${i}" ${have?'disabled':''}>${have?'보유 중':'구매하기'}</button></footer></article>`}).join('');document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{let i=+b.dataset.buy,p=+shopItems[i][3];if(coins<p)return toast('코인이 조금 더 필요해요!');coins-=p;owned.push(i);update();toast(`${shopItems[i][1]}을(를) 얻었어요!`)})}
    $('#submit').onclick=()=>{let lines=$('#review').value.trim().split('\n').filter(Boolean);if(lines.length<3)return toast('세 줄로 마음을 들려주세요 🙂');done.push(selected);coins+=30;$('#dialog').classList.remove('show');renderBooks();toast('감상문 완료! 30코인을 받았어요 🪙')};$('#cancel').onclick=()=>$('#dialog').classList.remove('show');$('#recommend').onclick=()=>{renderBooks();toast(`${$('#grade').value} 추천 책을 준비했어요!`)};$('#grade').onchange=renderBooks;
    const now=new Date(), days=(8-now.getDay())%7||7;$('#countdown').textContent=days+'일';renderBooks();renderShop();
  </script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}
</script>
</body>
</html>
